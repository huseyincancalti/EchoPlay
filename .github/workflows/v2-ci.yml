name: EchoPlay 2

# Every push to main and every pull request: EchoPlay 2 (app/) builds on clean Windows, Linux and macOS runners and its unit
# tests pass. The same steps as on the maintainer's PC: tools/setup-dev.sh, then tools/check.sh v2 (configure, build, ctest
# without the e2e suite, which needs a screen). The player-window tests stay local (tools/e2e.sh).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      ECHOPLAY_DEV: ${{ github.workspace }}/../echoplay-dev
    steps:
      - uses: actions/checkout@v4

      - name: Cache the toolchain (Qt, MinGW, libmpv, Vulkan loader)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../echoplay-dev
          key: echoplay-dev-${{ hashFiles('tools/setup-dev.sh') }}

      - name: FFmpeg (some unit tests make their clips with it)
        run: choco install ffmpeg -y --no-progress > /dev/null && ffmpeg -version | head -1

      - name: Set up the toolchain
        run: bash tools/setup-dev.sh

      - name: Build and unit tests
        run: bash tools/check.sh v2

      - name: Keep the log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-v2-log
          path: .out/check-v2.log

  # Linux: the same build and unit tests (OpenGL render path), in an Ubuntu 26.04 container: its Qt (6.10) and libmpv
  # (0.41) are new enough. Ubuntu 24.04's libmpv 0.37 cannot: loadfile's index argument came in mpv 0.38. Headless:
  # offscreen platform.
  build-and-test-linux:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      QT_QPA_PLATFORM: offscreen
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Qt, libmpv, FFmpeg and build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake ninja-build g++ pkg-config libmpv-dev ffmpeg             qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-declarative-private-dev qt6-shadertools-dev             qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-effects qml6-module-qtquick-layouts             qml6-module-qtquick-window qml6-module-qtquick-dialogs qml6-module-qtquick-shapes             qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtcore > /dev/null
          echo "libmpv $(pkg-config --modversion mpv)"

      - name: Build and unit tests
        run: CMAKE_GENERATOR=Ninja bash tools/check.sh v2

      - name: Keep the log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-v2-log-linux
          path: .out/check-v2.log

  # macOS on Apple Silicon: the same build and unit tests (OpenGL render path) with Homebrew's Qt and libmpv.
  build-and-test-macos:
    runs-on: macos-15
    env:
      QT_QPA_PLATFORM: offscreen
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      - name: Qt, libmpv, FFmpeg and build tools
        run: |
          brew install --quiet qt mpv ffmpeg ninja pkg-config > /dev/null
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"
          echo "Qt $(brew list --versions qt), libmpv $(pkg-config --modversion mpv)"

      - name: Build and unit tests
        run: CMAKE_GENERATOR=Ninja bash tools/check.sh v2

      - name: Keep the log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-v2-log-macos
          path: .out/check-v2.log
