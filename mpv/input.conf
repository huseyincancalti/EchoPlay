# ============================ EchoPlay input.conf ============================
# The whole context menu is built by the EchoPlay script (fully localized).

a          script-message echoplay-menu
MBTN_RIGHT script-message echoplay-menu
g          script-message echoplay-speed

# s/d nudge the live playback speed up/down by a configurable step (Settings menu);
# this replaces mpv's own s=screenshot and d=cycle-deinterlace defaults on these two
# keys, so screenshot moves to F1 instead (Shift+s/Ctrl+s screenshot variants are
# untouched - different key combos).
F1         screenshot
s          script-message echoplay-speed-down
d          script-message echoplay-speed-up

# Volume: Up/Down (hold to ramp) + mouse wheel.
# osd-bar is off (mpv.conf), so we flash uosc's own volume element instead of
# the native white bar.
UP         no-osd add volume 5  ; script-binding uosc/flash-volume
DOWN       no-osd add volume -5 ; script-binding uosc/flash-volume
WHEEL_UP   no-osd add volume 5  ; script-binding uosc/flash-volume
WHEEL_DOWN no-osd add volume -5 ; script-binding uosc/flash-volume

# Seek 10s with Left/Right -> flash the EchoPlay timeline so you see where you are.
RIGHT      no-osd seek 10  ; script-binding uosc/flash-timeline
LEFT       no-osd seek -10 ; script-binding uosc/flash-timeline

# Mute
m          cycle mute

# Quick per-track audio toggles
Ctrl+1     script-message echoplay-toggle 1
Ctrl+2     script-message echoplay-toggle 2
Ctrl+3     script-message echoplay-toggle 3
