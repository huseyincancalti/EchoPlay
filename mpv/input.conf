# ============================ EchoPlay input.conf ============================
# The whole context menu is built by the EchoPlay script (fully localized).
# Every rebindable action (see KEY_ACTIONS in scripts/echoplay-audio/main.lua: speed, screenshots,
# track toggles, mute, pause, volume, seek) is registered by the script itself via
# mp.add_forced_key_binding, so none of them are bound here - they're all rebindable
# live from Settings -> Yardım -> Klavye Kısayolları without touching this file.
# Right-click is the one fixed way into that menu.

MBTN_RIGHT script-message echoplay-menu

# Mouse wheel volume (not user-rebindable - wheel isn't a "shortcut" in that sense).
# osd-bar is off (mpv.conf), so we flash uosc's own volume element instead of the
# native white bar.
WHEEL_UP   no-osd add volume 5  ; script-binding uosc/flash-volume
WHEEL_DOWN no-osd add volume -5 ; script-binding uosc/flash-volume
