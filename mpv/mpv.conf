# ============================ EchoPlay mpv.conf ============================
# UI handled by uosc -> disable built-in OSC and the native white OSD bar
# (volume / seek feedback is drawn by uosc instead, see input.conf flash-*).
osc=no
osd-bar=no
border=no
keep-open=yes
cursor-autohide=1000
# Show the media title while playing, "EchoPlay" on the idle screen / taskbar.
title=${?media-title:${media-title}}${!media-title:EchoPlay}

# ---- Video / GPU (RTX-friendly defaults) ----
profile=high-quality      # modern replacement for the old "gpu-hq" profile
vo=gpu-next               # libplacebo renderer (default since mpv 0.41)
# d3d11 uses a DWM flip-model swapchain that composites borderless windows
# cleanly on Windows. (vulkan can make a borderless window flash transparent
# on some NVIDIA setups - switch back to vulkan only if you hit issues.)
gpu-api=d3d11
hwdec=auto-safe
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# ---- Audio ----
volume=100
volume-max=300
audio-pitch-correction=yes
# Loudness boost baked into playback: quiet recordings (e.g. ShadowPlay) come out
# strong. m=25 lets quiet parts be lifted up to 25x. Raise m (up to 100) for even
# more, lower g for a more aggressive/faster response. Remove the line for raw audio.
af=dynaudnorm=p=0.9:m=25:g=15

# ---- Continue watching: resume each file where you left off ----
save-position-on-quit=yes

# ---- Browse folder as playlist (replaces obsolete autoload.lua) ----
autocreate-playlist=same

# ---- Screenshots ----
screenshot-format=png
screenshot-directory=~~desktop/

# ---- Cache (auto = only network streams; keeps the local-file timeline clean) ----
cache=auto
demuxer-max-bytes=256MiB
