# ============================ EchoPlay mpv.conf ============================
# UI handled by uosc -> disable built-in OSC and the native white OSD bar
# (volume / seek feedback is drawn by uosc instead, see input.conf flash-*).
osc=no
osd-bar=no
border=no
# "always" (not "yes") is required for the "Stop at end" default to actually stick - "yes"
# only stops mpv exiting when there's nothing left in the playlist, it does NOT stop
# mid-playlist auto-advance, which autocreate-playlist=same below creates for every folder.
# Verified live: with "yes", playback silently jumped to the next file in the folder; with
# "always" it correctly pauses on the last frame of the current file. See set_end() in
# scripts/echoplay-audio/main.lua for how the other two modes (loop / play next) override this
# per file.
keep-open=always
cursor-autohide=1000
# Default (non-maximized) window: roughly half the screen, so dropping out of
# fullscreen/maximized doesn't leave a near-fullscreen window covering the desktop.
autofit=50%
# UI font for all uosc text (menus, timeline, tooltips - uosc reads osd-font).
# Segoe UI Variable ships with Windows 11, Segoe UI with 10; on macOS/Linux mpv
# silently falls back to the system sans-serif, so this is safe cross-platform.
osd-font=Segoe UI Variable Display
# Show the media title while playing, "EchoPlay" on the idle screen / taskbar.
title=${?media-title:${media-title}}${!media-title:EchoPlay}

# ---- Video / GPU (broad-hardware-friendly defaults) ----
vo=gpu-next               # libplacebo renderer (default since mpv 0.41)
hwdec=auto-safe
# scale/cscale intentionally use the separable "lanczos" kernel, not
# "ewa_lanczossharp" (mpv's high-quality profile default): EWA/polar scalers
# are dramatically more GPU-shader-heavy per pixel than separable ones and
# are the most common cause of stutter on anything but a high-end GPU,
# especially at 1440p/4K or high refresh rates. lanczos is still noticeably
# sharper than bilinear/bicubic at a fraction of the cost.
scale=lanczos
cscale=lanczos
dscale=mitchell
# Kept from mpv's high-quality profile: cheap HDR tone-mapping tweaks, no
# meaningful GPU cost of their own (only affects HDR source content).
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30

# ---- Audio ----
volume=100
volume-max=300
audio-pitch-correction=yes
# Loudness boost baked into playback: quiet recordings (e.g. ShadowPlay) come out
# strong. m=25 lets quiet parts be lifted up to 25x. Raise m (up to 100) for even
# more, lower g for a more aggressive/faster response. Remove the line for raw audio.
af=dynaudnorm=p=0.9:m=25:g=15

# ---- Continue watching: scripts/echoplay-audio/resume.lua tracks position itself and asks first
# (on-screen "resume from X?" prompt) instead of silently jumping - so mpv's own
# silent auto-resume is turned off here.
save-position-on-quit=no
resume-playback=no

# ---- Browse folder as playlist (replaces obsolete autoload.lua) ----
autocreate-playlist=same

# ---- Screenshots ----
screenshot-format=png
screenshot-directory=~~desktop/

# ---- Cache (auto = only network streams; keeps the local-file timeline clean) ----
cache=auto
demuxer-max-bytes=256MiB

# ---- Picture-quality tiers (Settings -> Görüntü Kalitesi -> Performans Modu) ----
# Applied/reverted at runtime by scripts/echoplay-audio/quality.lua, either automatically on sustained
# dropped frames or by explicit user choice. Not applied by mpv itself - profile-cond is
# intentionally absent; these only activate via `apply-profile` called from Lua.
# profile-restore=copy lets `apply-profile ... restore` put everything back, without the
# Lua code needing to know what "normal" was.
# Three tiers only:
#   Ultra  = zero-compromise: EWA/polar Lanczos (mpv's own high-quality profile scaler,
#            the priciest and sharpest it ships), plus every quality-preserving pass on.
#   Normal = NOT a profile - the tuned top-level defaults above (separable lanczos):
#            visibly sharp, a fraction of Ultra's GPU cost. Restoring any tier lands here.
#   Low    = weakest-hardware mode: bilinear everywhere and the optional quality passes
#            (downscale gamma correction, sigmoid upscaling, dithering) turned off -
#            the cheapest per-pixel path gpu-next has short of pixelated nearest.
[echoplay-tier-ultra]
profile-restore=copy
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

[echoplay-tier-low]
profile-restore=copy
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
sigmoid-upscaling=no
dither=no

# ---- Platform-specific GPU backend ----
# d3d11 uses a DWM flip-model swapchain that composites borderless windows
# cleanly on Windows (vulkan can make a borderless window flash transparent on
# some NVIDIA setups there). Auto-applies on Windows only; macOS/Linux keep
# libplacebo's own backend auto-detection (vulkan/opengl), which is already
# the right choice on those platforms. Must stay last: everything after a
# [profile] heading in mpv.conf belongs to that profile, not the defaults.
[echoplay-windows-gpu]
profile-cond=(get("platform","") == "windows")
profile-restore=copy
gpu-api=d3d11
