# EchoPlay audio mixer settings

# UI language. Strings are loaded from script-opts/echoplay-<language>.json
# (ships with tr + en; copy one to add a new language).
language=tr

# Tracks enabled on file open: comma-separated indices, or "all".
default_on=1

# amix volume handling for combined tracks: 0 = full volume, 1 = avoid clipping.
mix_normalize=0

# Per-track gain: change per +/- press, and ceiling (1.0 = 100%).
gain_step=0.25
gain_max=4.0

# OSD popup on change
osd=yes
osd_duration=2

# Track names are read dynamically from each file's metadata (ShadowPlay tags them
# "System sounds" / "Microphone"). Only set this to OVERRIDE those names, e.g:
# labels=1=Oyun,2=Ben
labels=
