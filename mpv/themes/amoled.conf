# AMOLED
# Example community theme pack. Built-in Dark/Light + accent live in the
# "Mode"/"Accent" sections of the Theme menu; a pack like this is for fuller
# looks - it can set ANY uosc option (colors, opacity, corner radius...).
# Copy this file, rename it, tweak the values, and it shows up under
# "Custom Themes". The first "# Comment" line is the name shown in the menu.
color=foreground=ffffff,background=000000,background_text=ffffff,curtain=000000
opacity=menu=1,submenu=0.6,border=1
border_radius=14
